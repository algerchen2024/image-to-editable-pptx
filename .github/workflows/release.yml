name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Validate and test
        run: |
          python scripts/validate_skill.py .
          python -m unittest discover -s tests -v
          python scripts/validate_page_ir.py examples/minimal/page_ir.json
          node scripts/compile_page_ir.js examples/minimal/page_ir.json /tmp/example.pptx
          python scripts/inspect_pptx.py /tmp/example.pptx
      - name: Package skill
        run: python scripts/package_skill.py . --outdir dist
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/skill.zip --clobber
